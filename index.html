<script>
(function(){

  // 화면 잠금(ledger_lock)·알림 대기열(ledger_markq)·탭(ledger_tab)·범위(ledger_scope)는 작아서 예전처럼 localStorage에 둡니다.
  const IDB_NAME="hangot_ledger_db", IDB_STORE="kv", IDB_VER=1;

  // ---------- 한 건씩 연속 검수 (편한가계부식) ----------
  // 문자 규칙(카드명·끝4자리·발신자·키워드)으로 자산을 먼저 채우고,
  // 고른 분류를 저장하면 그 가게(또는 발신 패턴) → 항목을 규칙으로 기억합니다.
  let reviewSkip=new Set();
  function paren4(s){const out=[];const re=/[\(\[]\s*(\d{4})\s*[\)\]]/g;const str=S(s);let m;while((m=re.exec(str)))out.push(m[1]);return out;}
  function cardByDigits(txt){const d4=paren4(txt);if(!d4.length)return null;
    return meta.cards.find(c=>d4.some(d=>S(c.n).replace(/\D/g,"").slice(-4)===d||S(c.n).replace(/\D/g,"").includes(d)))||null;}
  function acctByDigits(txt){const d4=paren4(txt);if(!d4.length)return null;
    return meta.accts.find(a=>d4.some(d=>S(a.n).replace(/\D/g,"").includes(d)))||null;}
  function assetBySms(o){
    const all=[...meta.cards.map(x=>({t:"card",x})),...meta.accts.map(x=>({t:"acct",x}))];
    const raw=[o.title,o.text,o.memo].join(" "),phone=cfDigits([o.title,o.phone].filter(Boolean).join(" ")),rawD=cfDigits(raw);
    let hit=all.find(e=>{const p=cfDigits(e.x.smsPhone);return p.length>=6&&(phone.indexOf(p)>=0||rawD.indexOf(p)>=0);});
    if(!hit)hit=all.find(e=>{const a=norm(e.x.appMatch);return a.length>=2&&norm(o.app).indexOf(a)>=0;});
    if(!hit)hit=all.find(e=>(e.x.smsKeywords||[]).some(k=>k&&norm(raw).indexOf(norm(k))>=0));
    return hit||null;
  }
  function assetFrom(o){
    const sm=assetBySms(o);
    if(sm&&!(sm.t==="card"&&o.k!=="exp"))return sm.t==="card"?sm.x.id:"a:"+sm.x.id;
    const raw=[o.app,o.title,o.text].join(" "),memo=S(o.memo);
    if(o.k==="exp"){

      if(c)return c.id;

  function suggestCat(o){

    const memo=S(o.memo),k=keyOf(memo);
    const r=(meta.autoRules||[]).find(x=>x.kw&&x.kind===o.k&&x.cat&&catById(x.cat)&&norm(memo).includes(norm(x.kw)));
    if(r)return r.cat;
    const r2=meta.rules.find(x=>x.to&&catById(x.to)&&catById(x.to).k===o.k&&k&&norm(memo).includes(norm(x.k)));
    if(r2)return r2.to;
    if(k.length>=2){const cnt=new Map();
      allTx().forEach(t=>{if(t.k!==o.k||!catById(t.cat))return;if(keyOf(t.memo)===k)cnt.set(t.cat,(cnt.get(t.cat)||0)+1);});

  function rememberKey(o){

      h("div",{class:"card-head"},h("h2",{text:"가져올 알림 고르기"}),h("span",{class:"lab",text:"직접 넣고 빼기"})),
      h("p",{class:"hint",text:"금액이 든 문자·알림은 '가져올 단어'로 골라요. 번호나 앱을 등록해 두면 금액·단어가 없어도 그것만으로 가져와요. 칩을 누르면 빼고, 아래에 적고 '추가'를 누르면 바로 들어가요."}),
      grp("words","가져올 단어","거래·금융기관을 알리는 말이에요. 이 말이 들어 있으면 금융 알림으로 봐요.","예: 급여, 카드값"),
      grp("senders","허용 번호 (문자 발신번호)","여기 적은 번호에서 온 문자는 금액·단어와 상관없이 수집함에 가져와요. 하이픈은 있어도 없어도 돼요.","예: 1577-6000, 1588-8700",24),
      grp("apps","허용 어플 (앱 이름)","여기 적은 앱이 보낸 알림은 그대로 가져와요. 이름 일부만 적어도 돼요.","예: 현대카드, KB Pay, 토스",24),
      grp("blocks","제외할 앱·단어·번호","보낸 앱 이름이나 알림 글에 이 말이 있으면 걸러요. 기본으로 피클·MacroDroid가 들어 있어요.","예: 피클, 광고",24),
      h("div",{class:"acts"},delBtn("기본값으로 되돌리기",()=>{meta.collectFilter=null;touch("meta");render();toast("기본값으로 되돌렸어요");})),
      h("p",{class:"hint",text:"바꾼 기준(단어·번호·어플·제외)은 이 기기(IndexedDB)와 백업 파일에 함께 저장돼요. 수집함에서 '새로 불러오기'를 누르면 지금까지 온 알림을 새 기준으로 다시 골라요. 걸러진 알림은 시트에서도 처리된 것으로 정리되어 다시 뜨지 않으니, 기준을 넓히면 그다음에 오는 알림부터 적용돼요."}));
  }
  function viewRules(){const P=[back("더보기")];
    const ac=h("input",{type:"checkbox",id:"au-apply",checked:!!meta.autoApply});ac.addEventListener("change",()=>{meta.autoApply=ac.checked;touch("meta");});
    P.push(h("section",{class:"card"},h("h2",{text:"문자·알림 자동 수집"}),
      h("p",{class:"hint",text:"MacroDroid가 보낸 문자·알림을 가계부를 열 때 자동으로 불러와요. 규칙에 맞으면 항목과 계좌·카드가 미리 채워집니다."}),
      h("label",{class:"switch"},ac,"규칙에 맞는 건 묻지 않고 바로 기록하기"),
      h("div",{class:"acts"},
        h("button",{class:"btn line",type:"button",onclick:()=>{fetchAlerts(true);toast("불러오는 중이에요");}},"지금 불러오기"),
        h("button",{class:"btn",type:"button",onclick:()=>{sub="alerts";render();}},"수집함 열기")),
      SHEET_EDIT?h("a",{class:"ghost",href:SHEET_EDIT,target:"_blank",rel:"noopener",style:"text-decoration:underline;align-self:flex-start"},"시트에서 쌓인 문자 보기"):null));
    P.push(cfCard());
    const card=h("section",{class:"card"},h("div",{class:"card-head"},h("h2",{text:"기억한 규칙"}),h("span",{class:"lab",text:(meta.autoRules||[]).length+"개"})));
    if(!(meta.autoRules||[]).length)card.append(h("p",{class:"empty",text:"아직 규칙이 없어요. 수집함에서 분류할 때 '이 규칙 기억하기'를 켜 두면 여기에 쌓여요."}));
    (meta.autoRules||[]).forEach(r=>card.append(ruleRow(r)));
    card.append(h("button",{class:"addrow",type:"button",id:"rule-add",onclick:()=>{meta.autoRules.push({id:rid(),kw:"",app:"",kind:"exp",cat:"",acct:"",to:"",card:"",memo:""});touch("meta");render();}},"+ 규칙 추가"),
      h("p",{class:"hint",text:"카드사·발신자·문구별로 만들어 두세요. 글에 '문자에 들어 있는 말'이 있고, '발신자'를 적었으면 그 앱이 보냈을 때만 규칙이 적용돼요. 고른 결제 수단·항목·구분이 수집함 카드에 미리 채워져요."}));
    P.push(card);return P;}

  // ---------- render ----------
  const ICON={home:"M3 11l9-7 9 7M5 10v10h14V10",list:"M4 6h16M4 12h16M4 18h10",card:"M3 6h18v12H3zM3 10h18",asset:"M4 20V10M10 20V4M16 20v-8M22 20H2",stats:"M12 3a9 9 0 1 0 9 9h-9z",more:"M5 12h.01M12 12h.01M19 12h.01"};
  const MICO={alerts:"M12 3a5 5 0 0 0-5 5v3l-2 4h14l-2-4V8a5 5 0 0 0-5-5zM9 18a3 3 0 0 0 6 0",rules:"M4 6h16M4 12h16M4 18h10",ev:"M20 12v8H4v-8M2 8h20v4H2zM12 8v12",fx:"M4 4h16v16H4zM8 9h8M8 14h5",sync:"M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4",bk:"M12 3v12m0 0 4-4m-4 4-4-4M4 17v2h16v-2",dup:"M8 8h10v10H8zM6 16H4V4h12v2",lock:"M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3",cat:"M4 7h16M4 12h10M4 17h7",hol:"M4 6h16v14H4zM8 3v4M16 3v4",more:"M5 12h.01M12 12h.01M19 12h.01"};
  const TABS=[["home","홈"],["list","내역"],["stats","통계"],["card","카드"],["asset","자산"],["more","더보기"]];
  function setTab(t){tab=t;sub="";imp=null;bimp=null;queue=[];qMsg="";ls.set("ledger_tab",t);window.scrollTo(0,0);render();}
  function setScope(s){scope=s;ls.set("ledger_scope",s);render();}
  function render(){
    if(!$("scrim").hidden)return;
    $("nav").replaceChildren(...TABS.map(([id,n])=>{const s=sv("svg",{viewBox:"0 0 24 24","aria-hidden":"true"});s.append(sv("path",{d:ICON[id]}));
      return h("button",{type:"button","aria-current":id===tab?"page":null,onclick:()=>setTab(id)},s,n);}));
    const monthly=tab==="home"||tab==="list"||tab==="stats",scoped=monthly||(tab==="more"&&sub==="fx");
    $("scope").hidden=!scoped;$("mnav").hidden=!(monthly||(tab==="more"&&sub==="fx"));$("fab").hidden=!(ready&&monthly);
    const ab=$("alerts");ab.hidden=!(ready&&monthly);
    if(!ab.hidden){const n=alertPend().length;
      ab.replaceChildren(h("button",{class:"alertbar",type:"button",onclick:()=>{if(!n&&!alertBusy)fetchAlerts(true);tab="more";sub="alerts";ls.set("ledger_tab","more");window.scrollTo(0,0);render();}},
        h("span",{text:alertBusy?"실시간 알림 확인 중…":n?"실시간 알림 "+n+"건 도착 · 확인하기":"실시간 알림 불러오기"}),
        h("span",{class:"n"+(n?"":" q"),text:n?String(n):"↻"})));}
    $("scope").replaceChildren(...[["all","전체"],["ph","약국"],["hm","생활"]].map(([v,l])=>h("button",{type:"button","aria-pressed":String(v===scope),onclick:()=>setScope(v)},l)));
    $("mnav").replaceChildren(h("button",{class:"marr",type:"button","aria-label":"이전 달",onclick:()=>{ym=shiftYM(ym,-1);render();}},"‹"),
      h("button",{class:"ghost",type:"button",style:"color:var(--ink)","aria-label":ymLabel(ym)+". 누르면 이번 달로",onclick:()=>{ym=YM();render();}},h("b",{text:ymLabel(ym)})),
      h("button",{class:"marr",type:"button","aria-label":"다음 달",onclick:()=>{ym=shiftYM(ym,1);render();}},"›"));
    let P;
    if(!ready)P=[h("section",{class:"card"},h("p",{class:"empty",text:mode==="slow"?"기록을 아직 불러오지 못했어요. 연결되면 바로 보여 드릴게요.":"기록을 불러오는 중이에요…"}))];
    else if(tab==="home")P=viewHome();else if(tab==="list")P=viewList();else if(tab==="stats")P=viewStats();
    else if(tab==="card")P=viewCard();
    else if(tab==="asset")P=viewAsset();
    else P=viewMore();
    $("view").replaceChildren(...P);setStatus();}
  $("fab").addEventListener("click",()=>openTx(null));
  $("scrim").addEventListener("click",e=>{if(e.target===$("scrim"))closeSheet();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&draft)closeSheet();});
  const saveOnHide=()=>{if(mode==="local"&&dirty.size&&!writing){clearTimeout(timer);flush();}};
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveOnHide();});
  window.addEventListener("pagehide",saveOnHide);

  // ---------- boot ----------
  async function goLocal(){mode="local";
    if(!lockDoc&&!lockCfg){try{lockCfg=okCfg(JSON.parse(ls.get("ledger_lock")||"null"));}catch(e){}if(lockCfg)showLock();}
    // ① IndexedDB를 먼저 열어 봅니다. 안 되는 브라우저에서만 예전처럼 localStorage를 씁니다.
    let hasIdb=false;
    try{await idb.open();hasIdb=true;}catch(e){hasIdb=false;}
    store=hasIdb?"idb":(probeLS()?"ls":"none");
    if(store==="ls"){storeWarn=true;storeMsg="이 브라우저에서는 대용량 저장(IndexedDB)을 쓸 수 없어 예전 방식으로 저장해요. 기록이 5MB를 넘으면 저장되지 않을 수 있어요.";}
    if(store==="none"){storeWarn=true;storeMsg="이 브라우저에서는 기록을 저장할 수 없어요. 창을 닫으면 기록이 사라져요. Chrome에서 이 파일을 열거나, 더보기 › 백업에서 파일로 내려받아 두세요.";}
    // ② 저장된 기록: IndexedDB → (비어 있으면) 예전 localStorage 기록
    let loaded=null,moved=false,readErr=false;
    if(store==="idb"){try{const o=await idb.get(STATE_KEY);if(o&&o.meta&&o.months)loaded=o;}
      catch(e){try{await sleep(300);const o=await idb.get(STATE_KEY);if(o&&o.meta&&o.months)loaded=o;}catch(e2){readErr=true;}}}
    if(readErr){store="none";storeWarn=true;
      storeMsg="이 기기에 저장된 기록을 열지 못했어요. 다른 창에서 열려 있지 않은지 확인하고 페이지를 다시 열어 주세요. 지금은 새 기록을 저장하지 않아요(예전 기록을 덮어쓰지 않으려고요).";}
    else if(!loaded){const s=ls.get(STATE_KEY);
      if(s){try{const o=JSON.parse(s);if(o&&o.meta&&o.months){loaded=o;moved=(store==="idb");}}catch(e){}}}
    if(loaded)adoptState(loaded);
    ready=true;applyFixed();if(snapCheck())touch("meta");render();drawSaveAlert();
    // ③ 예전 localStorage 기록을 IndexedDB로 옮겨 둡니다(옮긴 뒤에도 원본 사본은 지우지 않아요).
    if(moved){try{await saveState();ls.set("ledger_migrated",JSON.stringify({at:new Date().toISOString(),tx:liveCounts().tx}));dirty.clear();toast("예전 기록을 새 저장 방식으로 옮겼어요");}
      catch(e){store=probeLS()?"ls":"none";saveErr=true;saveErrMsg="예전 기록을 IndexedDB로 옮기지 못해 "+(store==="ls"?"예전 방식으로 계속 저장해요.":"이 화면에만 남겨 둘 수밖에 없어요.");setStatus();drawSaveAlert();}}
    setTimeout(()=>fetchAlerts(false),600);setTimeout(syncBoot,700);}
  render();
  (async()=>{
    // 브라우저가 저장소를 임의로 정리하지 않도록 영구 저장을 요청합니다(허용되지 않아도 그대로 씁니다).
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
    const cl=window.claude;if(!cl||!cl.use){await goLocal();return;}
    cl.use("dictation").then(x=>{dict=x;if(x)wireDict();}).catch(()=>{});cl.use("assets").then(x=>{assetsCap=x;}).catch(()=>{});
    cl.use("mcp").then(x=>{capMcp=x;if(tab==="more"&&sub==="bk")render();}).catch(()=>{});cl.use("downloads").then(x=>{capDl=x;if(tab==="more"&&sub==="bk")render();}).catch(()=>{});
    let db=null,user=null;try{[db,user]=await Promise.all([cl.use("db"),cl.use("user")]);}catch(e){}
    let id=null;try{id=user?await user.id():null;}catch(e){}
    if(!db||!id){await goLocal();return;}
    // Shared ledger: everyone the page is shared with reads and writes "ledger". Records kept earlier in the owner's private space move over once.
    try{col=db.collection("ledger");const priv=db.collection("data/users/"+id);
      lockDoc=priv.doc("lock");const lk=await lockDoc.get();lockCfg=lk.exists?okCfg(lk.data()):null;if(lockCfg)showLock();
      const mk=await priv.doc("moved").get();
      if(!mk.exists){let ps=await priv.get();if(ps.metadata&&ps.metadata.fromCache){await new Promise(r=>setTimeout(r,1500));ps=await priv.get();}
        const mine=ps.docs.filter(d=>d.id==="meta"||/^m-\d{4}-\d{2}$/.test(d.id));
        if(mine.some(d=>d.id==="meta")){for(const d of mine)await col.doc(d.id).set(d.data());await priv.doc("moved").set({at:today(),n:mine.length});}}
    }catch(e){mode="dead";moveErr=true;render();return;}
    const slow=setTimeout(()=>{if(mode==="loading"){mode="slow";render();}},10000);
    col.onSnapshot(snap=>{
      snap.docs.forEach(d=>{if(!dirty.has(d.id)&&!(saving&&d.metadata.hasPendingWrites))adoptDoc(d.id,d.data());});
      if(!snap.metadata.fromCache&&!ready){clearTimeout(slow);mode="cloud";ready=true;applyFixed();if(snapCheck())touch("meta");setTimeout(()=>fetchAlerts(false),600);}
      render();
    },()=>{clearTimeout(slow);if(!ready)goLocal();else{mode="dead";setStatus();}});
  })();
})();
